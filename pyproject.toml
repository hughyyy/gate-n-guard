[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-n-guard"
version = "0.1.0"
description = "MCP server for gating agent actions against a rulebook (allow/confirm/deny) with model-backed policy advice"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2",
    "httpx>=0.27",
]

[project.scripts]
gate-n-guard = "gate_n_guard.server:main"

[tool.setuptools.packages.find]
where = ["src"]
